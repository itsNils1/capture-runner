name: capture
run-name: capture

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job id
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Capture
        env:
          JOB_SPEC_URL: ${{ secrets.JOB_SPEC_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          JOB_ID: ${{ inputs.job }}
        run: node run.mjs
