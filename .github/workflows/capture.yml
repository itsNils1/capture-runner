name: capture
run-name: capture

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job id
        required: true
        type: string
      parts:
        description: JSON array of part indexes
        required: false
        default: "[0]"
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: |
            ~/ffmpeg-bin
            ~/aptdebs
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Install system packages
        run: |
          lscpu | grep -m1 'Model name' || true
          if [ ! -x ~/ffmpeg-bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg-bin
            curl -fsSL --retry 3 --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              | tar xJ --strip-components=1 -C ~/ffmpeg-bin --wildcards '*/ffmpeg' || rm -f ~/ffmpeg-bin/ffmpeg
          fi
          [ -x ~/ffmpeg-bin/ffmpeg ] && echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          need=""
          [ -x ~/ffmpeg-bin/ffmpeg ] || command -v ffmpeg >/dev/null || need="$need ffmpeg"
          ls /usr/lib/$(uname -m)-linux-gnu/libEGL_mesa.so.0 >/dev/null 2>&1 || need="$need libegl1 libegl-mesa0 libgl1-mesa-dri"
          if [ -n "$need" ] && ls ~/aptdebs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/aptdebs/*.deb > /dev/null 2>&1 && need="" && echo "installed from cache"
          fi
          if [ -n "$need" ]; then
            echo "installing:$need"
            mkdir -p ~/aptdebs/partial
            for try in 1 2; do
              sudo timeout 120 apt-get install -y -qq --no-install-recommends -o Acquire::Retries=2 -o Dir::Cache::archives="$HOME/aptdebs" $need > /dev/null && break
              sudo timeout 60 apt-get update -qq || true
            done
            sudo chown -R "$USER" ~/aptdebs
            rm -rf ~/aptdebs/partial ~/aptdebs/lock
          fi

      - name: Capture
        env:
          JOB_SPEC_URL: ${{ secrets.JOB_SPEC_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          JOB_ID: ${{ inputs.job }}
          JOB_PART: ${{ matrix.part }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          CHROME_ARGS: --use-gl=angle --use-angle=gl-egl --ignore-gpu-blocklist --enable-gpu
        run: node run.mjs
