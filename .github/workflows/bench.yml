name: bench
run-name: bench

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames to capture per variant
        required: false
        default: "480"
        type: string
      variants:
        description: JSON array of variant names
        required: false
        default: '["a"]'
        type: string
      runners:
        description: JSON array of runner labels
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
        runner: ${{ fromJSON(inputs.runners) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: |
            ~/ffmpeg-bin
            ~/aptdebs
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Install system packages
        run: |
          lscpu | grep -m1 'Model name' || true
          if [ ! -x ~/ffmpeg-bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg-bin
            curl -fsSL --retry 3 --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              | tar xJ --strip-components=1 -C ~/ffmpeg-bin --wildcards '*/ffmpeg' || rm -f ~/ffmpeg-bin/ffmpeg
          fi
          [ -x ~/ffmpeg-bin/ffmpeg ] && echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          need=""
          [ -x ~/ffmpeg-bin/ffmpeg ] || command -v ffmpeg >/dev/null || need="$need ffmpeg"
          ls /usr/lib/$(uname -m)-linux-gnu/libEGL_mesa.so.0 >/dev/null 2>&1 || need="$need libegl1 libegl-mesa0 libgl1-mesa-dri"
          if [ -n "$need" ] && ls ~/aptdebs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/aptdebs/*.deb > /dev/null 2>&1 && need="" && echo "installed from cache"
          fi
          if [ -n "$need" ]; then
            echo "installing:$need"
            mkdir -p ~/aptdebs/partial
            for try in 1 2; do
              sudo timeout 120 apt-get install -y -qq --no-install-recommends -o Acquire::Retries=2 -o Dir::Cache::archives="$HOME/aptdebs" $need > /dev/null && break
              sudo timeout 60 apt-get update -qq || true
            done
            sudo chown -R "$USER" ~/aptdebs
            rm -rf ~/aptdebs/partial ~/aptdebs/lock
          fi
          if [ ! -x /usr/bin/google-chrome ]; then
            npx -y playwright@1.52.0 install --with-deps chromium > /dev/null
            echo "CHROME_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Run
        env:
          BENCH_SPEC: ${{ secrets.BENCH_SPEC }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          DRY_RUN: "1"
          MAX_FRAMES: ${{ inputs.frames }}
          VARIANT: ${{ matrix.variant }}
          JOB_PART: "1"
          DIAG_DIR: samples
          READY_TIMEOUT_MS: "120000"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          CHROME_ARGS: --use-gl=angle --use-angle=gl-egl --ignore-gpu-blocklist --enable-gpu
        run: |
          export SPEC_JSON="$(node bench-spec.mjs)"
          node run.mjs

      - name: Pack samples
        if: always()
        env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          mkdir -p samples
          touch samples/.keep
          f=work/part-1/output.mp4
          if [ -f "$f" ]; then
            for s in 1 3 5 7; do ffmpeg -loglevel error -y -ss $s -i "$f" -frames:v 1 -q:v 3 samples/s$s.jpg || true; done
            ls -la "$f"
          fi
          tar cf - samples | openssl enc -aes-256-cbc -pbkdf2 -pass env:JOB_TOKEN -out samples.bin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples-${{ matrix.variant }}-${{ matrix.runner }}
          path: samples.bin
          retention-days: 1
