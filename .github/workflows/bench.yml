name: bench
run-name: bench

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames to capture per variant
        required: false
        default: "480"
        type: string
      variants:
        description: JSON array of variant names
        required: false
        default: '["a"]'
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install system packages
        run: |
          lscpu | grep -m1 'Model name' || true
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          ls /usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0 >/dev/null 2>&1 || need="$need libegl1 libegl-mesa0 libgl1-mesa-dri"
          if [ -n "$need" ]; then
            for try in 1 2; do
              sudo timeout 120 apt-get install -y -qq --no-install-recommends -o Acquire::Retries=2 $need > /dev/null && break
              sudo timeout 60 apt-get update -qq || true
            done
          fi
          command -v ffmpeg

      - name: Run
        env:
          BENCH_SPEC: ${{ secrets.BENCH_SPEC }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          DRY_RUN: "1"
          MAX_FRAMES: ${{ inputs.frames }}
          VARIANT: ${{ matrix.variant }}
          JOB_PART: "1"
          DIAG_DIR: samples
          READY_TIMEOUT_MS: "120000"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          CHROME_ARGS: --use-gl=angle --use-angle=gl-egl --ignore-gpu-blocklist --enable-gpu
        run: |
          export SPEC_JSON="$(node bench-spec.mjs)"
          node run.mjs

      - name: Pack samples
        if: always()
        env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          mkdir -p samples
          touch samples/.keep
          f=work/part-1/output.mp4
          if [ -f "$f" ]; then
            for s in 1 3 5 7; do ffmpeg -loglevel error -y -ss $s -i "$f" -frames:v 1 -q:v 3 samples/s$s.jpg || true; done
            ls -la "$f"
          fi
          tar cf - samples | openssl enc -aes-256-cbc -pbkdf2 -pass env:JOB_TOKEN -out samples.bin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples-${{ matrix.variant }}
          path: samples.bin
          retention-days: 1
